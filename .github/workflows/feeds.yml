name: Refresh security news

on:
  schedule:
    - cron: '17 * * * *'     # every hour, at 17 past
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/fetch_feeds.py', '.github/workflows/feeds.yml']

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build/fetch_feeds.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/news.json; then echo "No change"; exit 0; fi
          git config user.name "caliit-feeds"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git commit -m "Refresh security news"
          git push
